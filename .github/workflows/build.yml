name: Deploy web to GitHub Pages
on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - id: pages
        uses: actions/configure-pages@v5
      - name: Create ads.txt when an AdSense ID is configured
        run: |
          cd web
          PUB=$(grep -o 'pub-[0-9]\{10,\}' ads-config.js | head -1 || true)
          if [ -n "$PUB" ]; then echo "google.com, $PUB, DIRECT, f08c47fec0942fa0" > ads.txt; echo "ads.txt created"; else echo "No AdSense ID yet"; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
